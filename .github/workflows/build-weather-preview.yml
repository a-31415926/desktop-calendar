name: Build weather V14 preview
on:
  push:
    branches: [feature/weather-panel-v14]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Test weather state and freshness
        run: node --experimental-strip-types --test tests/weather.test.mjs
      - run: pnpm build
      - name: Test native weather validation and Windows credential encryption
        run: cargo test --release --manifest-path src-tauri/Cargo.toml --lib weather::tests
      - name: Build installer
        run: pnpm tauri build --bundles nsis
      - name: Package verified build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force delivery | Out-Null
          Copy-Item 'src-tauri/target/release/bundle/nsis/*.exe' 'delivery/desktop-calendar-weather-v14-1.1.0-x64-setup.exe'
          Copy-Item 'src-tauri/target/release/DesktopCalendarWeather.exe' delivery
          Copy-Item THIRD_PARTY_WEATHER.md delivery
          Copy-Item src-tauri/Cargo.lock delivery
          "Commit: ${{ github.sha }}`nRun: ${{ github.run_id }}" | Set-Content delivery/BUILD.txt
          Get-ChildItem delivery -File | Get-FileHash -Algorithm SHA256 | Select-Object Hash,@{n='File';e={Split-Path $_.Path -Leaf}} | ConvertTo-Json | Set-Content delivery/SHA256SUMS.json
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-calendar-weather-v14-windows-x64
          path: delivery/
          retention-days: 90
          if-no-files-found: error
