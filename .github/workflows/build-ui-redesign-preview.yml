name: Build UI redesign preview

on:
  push:
    branches: [ui-redesign-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4

      - name: Rename app to 桌面日历
        shell: pwsh
        run: |
          $path = 'src-tauri/tauri.conf.json'
          $config = Get-Content $path -Raw | ConvertFrom-Json
          $config.productName = '桌面日历'
          $config.mainBinaryName = 'DesktopCalendar'
          $config.app.windows[0].title = '桌面日历'
          $config.bundle.shortDescription = '桌面日历'
          $config.bundle.longDescription = '桌面日历'
          $config | ConvertTo-Json -Depth 20 | Set-Content $path -Encoding UTF8

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer
        run: pnpm tauri build

      - name: Rename installer file
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          if (-not $installer) { throw '没有找到生成的安装包' }
          Rename-Item $installer.FullName '桌面日历-UI改版预览-1.0.0-x64.exe'

      - name: Upload preview installer
        uses: actions/upload-artifact@v4
        with:
          name: 桌面日历-UI改版预览
          path: src-tauri/target/release/bundle/nsis/桌面日历-UI改版预览-1.0.0-x64.exe
          if-no-files-found: error
